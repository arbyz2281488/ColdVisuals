name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          mkdir -p src/main/resources/assets/visuals/lang
          for f in *.java; do
            [ -f "$f" ] || continue
            pkg=$(grep -m1 '^package ' "$f" | sed 's/package //; s/;.*//' | tr -d '\r')
            dir="src/main/java/$(echo "$pkg" | tr . /)"
            mkdir -p "$dir"
            mv "$f" "$dir/"
          done
          [ -f en_us.json ] && mv en_us.json src/main/resources/assets/visuals/lang/ || true
          [ -f fabric.mod.json ] && mv fabric.mod.json src/main/resources/ || true
          [ -f visuals.mixins.json ] && mv visuals.mixins.json src/main/resources/ || true
          ls -R src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12.1

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: visuals-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
